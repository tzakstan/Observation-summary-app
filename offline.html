<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Offline — Imani Schools Observation Portal</title>
  <style>
    :root { --g: #0e4a43; --ink: #17201f; }
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f3f6f5;
      color: var(--ink);
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .card {
      background: #fff;
      padding: 36px 28px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 440px;
      margin: 16px;
      border-top: 4px solid var(--g);
    }
    h1 { color: var(--g); font-size: 22px; margin-bottom: 12px; }
    p { font-size: 15px; line-height: 1.6; color: #4a5568; }
    .icon { font-size: 48px; margin-bottom: 8px; }
    .btn {
      display: inline-block;
      margin-top: 18px;
      background: var(--g);
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Currently Offline</h1>
    <p>No active internet connection was detected. But don't worry—all your observation drafts, teacher notes, and local records are safely stored on this device.</p>
    <a href="./" class="btn">Return to Observation Portal</a>
  </div>
</body>
</html>
