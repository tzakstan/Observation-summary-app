const API="https://script.google.com/macros/s/AKfycbwZ5MSiow7g6A3MJVJpEYrEQ8ZahF-8c7k6t9p2kf1jdsSnzOSt3FR0D7e3uMoR_aFX/exec";
/*SEC*/const SEC=[{"h":"Related to Standards 1 & 3- Execution of the Lesson Plan","i":["Every part of the lesson plan (opening, LEs and closure) is delivered in a manner aligned to the lesson's learning outcome, i.e., leads to the LO.","Students or teachers use various resources, technologies, tools, manipulatives, or other instructional materials to achieve the LO.","The lesson is differentiated in one or more ways to accommodate varying student learning profiles, readiness, or interests.","The examples, questions, stories, anecdotes, reading materials, and other resources used are engaging, age-appropriate, and relevant to students’ lives and interests, as well as the Islamic perspective and Fatemi Culture.","The teacher successfully implements all parts of the lesson (opening, experiences, closure) as written in the plan, i.e., the lesson is more or less aligned.","The teacher constantly checks the pulse of the classroom and is aware when students seem confused or need additional support.","The lesson is student-centred.\nSome indicators for this include:\nStudent voice > Teacher's voice\nOpportunities for students to construct their understanding\nEvery student has the opportunity to develop and use the SKILL mentioned in the LO\nThe teacher uses UDL strategies to engage students at both margins","The teacher communicates the LO of the lesson to students and ensures they understand it (can be any time during the period)","The teacher communicates, gives clear instructions and directions for all activities, and explains concepts in an accurate, engaging, and age-appropriate manner.","The teacher asks different questions, including higher-order thinking questions involving application, analysis, evaluation, and content synthesis.","Peer, independent or group work is well executed with a clearly stated purpose, time limit and output, making it highly engaging, productive, meaningful and eliciting higher-order thinking when needed."]},{"h":"Related to Standards 2 Inclusion, Classroom Environment and Culture","i":["Students follow routines and norms during transitions, class discussions, group work, and independent practice, which helps ensure the smooth execution of the lesson.","Students create or refer to relevant displays while teaching (subject-related displays, word walls, rules, vision, student work, etc.).","All students are highly participative and interact freely and openly with the teacher. Teacher-student and student-student interactions are appropriate and conflict-free, and students feel safe in the class.","The teacher handles student misbehaviour calmly, poised, consistently modelling a respectful tone and body language.","The teacher demonstrates a growth mindset and holds every student to high expectations."]},{"h":"Related to Standards 4 Pedagogical Content Knowledge","i":["The teacher uses a variety of literacy strategies appropriate for the subject and spends time building content-specific vocabulary.","The teacher proactively provides opportunities for students to clear doubts.\nThe teacher clearly and accurately responds to students' questions and doubts and can identify and address misconceptions.","The teacher explicitly connects the students' learning experiences with their enduring understanding of the topic or the standards."]},{"h":"Related to Standards 5 Assessment","i":["The teacher selects the most appropriate formative assessment method, Check for Understanding, to assess whether the LO has been achieved."]}];/*END*/
const NOTE="Note specific evidence for points of Appreciation and Apprehension with Suggestions (It is not mandatory to cover every point in every observation.)";
const T2=["List 3 highlights/ things that went well in the classroom; the teacher did well with relevant evidence.","What are the teacher’s top 2 areas of improvement that will also be the focus of the following observation?"];
const FLAT=SEC.flatMap(s=>s.i),$=s=>document.querySelector(s),sp=n=>" ".repeat(n);
const esc=x=>String(x??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const get=async(a,p={})=>{const r=await(await fetch(API+"?"+new URLSearchParams({action:a,...p}))).json();if(r.error)throw new Error(r.error);return r};
const post=async(a,b)=>{const r=await(await fetch(API,{method:"POST",body:JSON.stringify({action:a,...b})})).json();if(r.error)throw new Error(r.error);return r};
const fail=e=>alert(e.message||e);
let S={c:{},hl:"",imp:"",audit:[],clar:[]},HIST=[],PEND=[],rec;
const M=()=>({t:$("#t").value.trim(),d:$("#d").value,g:$("#g").value,s:$("#s").value,tp:$("#tp").value,o:$("#o").value,n:$("#n").value});

const TABS=[["intake","New observation"],["audit","Audit"],["preview","Sheet"],["archive","Archive"]];
$("#nav").innerHTML=TABS.map(([k,l])=>`<button onclick="show('${k}')">${l}</button>`).join("");
function show(id){if(id=="preview"){sync();drawSheet()}TABS.forEach(([k],i)=>{$("#"+k).classList.toggle("on",k==id);$("#nav").children[i].classList.toggle("on",k==id)});if(id=="archive")arch()}
$("#d").value=new Date().toISOString().slice(0,10);
$("#guided").innerHTML=SEC.map(s=>`<details><summary>${esc(s.h)}</summary>${s.i.map(c=>`<div class="gi"><small>${esc(c.split("\n")[0])}</small><span class="chip" onclick="tag(this,' APPRECIATION')">+ Appreciation</span><span class="chip" onclick="tag(this,' APPREHENSION')">! Apprehension</span><input data-i="${FLAT.indexOf(c)}" placeholder="Evidence you saw"></div>`).join("")}</details>`).join("");
function tag(c,t){const p=c.parentNode,i=p.querySelector("input");i.dataset.t=i.dataset.t==t?"":t;p.querySelectorAll(".chip").forEach(x=>x.style.background=x==c&&i.dataset.t?"#cfe8e2":"#fff")}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert("Dictation isn't supported in this browser.");if(rec){rec.stop();rec=null;$("#mic").textContent="Dictate";return}
rec=new R();rec.continuous=true;rec.lang="en-IN";const t0=Date.now();rec.onresult=e=>{const x=e.results[e.results.length-1][0].transcript.trim(),s=Math.round((Date.now()-t0)/1e3),p=n=>String(n).padStart(2,"0");$("#notes").value+=`\n[${p(Math.floor(s/60))}:${p(s%60)}] ${x}`};rec.start();$("#mic").textContent="Stop"}
function chk(){const t=M().t,n=+M().n,h=HIST.filter(r=>r.teacher==t).sort((a,b)=>a.obs-b.obs),a=[];S.prev=h.length?h[h.length-1]:null;
if(h.some(r=>r.obs==n))a.push({type:"longitudinal",message:`Obs No ${n} already exists for ${t}.`});else if(S.prev&&n!=S.prev.obs+1)a.push({type:"longitudinal",message:`Obs No ${n} is out of sequence. The last saved observation for ${t} is Obs ${S.prev.obs}.`});
$("#ban").innerHTML=S.prev?`<div class="banner"><b>Focus from Obs ${S.prev.obs}:</b> ${esc(S.prev.imp)}</div>`:"";return a}
function newT(){const h=HIST.filter(r=>r.teacher==M().t);$("#n").value=Math.max(0,...h.map(r=>r.obs))+1;chk()}
async function analyze(){const m=M(),g=[...document.querySelectorAll("[data-i]")].filter(e=>e.value.trim()).map(e=>`[Criterion ${+e.dataset.i+1}${e.dataset.t||""}] ${e.value.trim()}`).join("\n"),notes=($("#notes").value.trim()+"\n"+g).trim();
if(!m.t||!notes)return alert("Enter the teacher's name and some observation notes.");
const local=chk(),b=$("#go");b.disabled=true;b.textContent="Analyzing…";
try{const r=await post("synthesize",{meta:m,notes,clar:S.clar,prev:S.prev&&{obs:S.prev.obs,focus:S.prev.imp},criteria:FLAT});
S.c=r.criteria||{};S.hl=r.highlights||"";S.imp=r.improvements||"";S.notes=notes;S.audit=[...local,...(r.discrepancies||[])];S.clar=[];drawAudit();show(S.audit.length?"audit":"preview")}catch(e){fail(e)}
b.disabled=false;b.textContent="Analyze & synthesize"}
function drawAudit(){$("#audit").innerHTML="<h2>Audit</h2>"+(S.audit.length?S.audit.map(a=>`<div class="card"><b>${esc(a.type)}</b><br>${esc(a.message)}${a.original?`<br><small>Original: ${esc(a.original)}<br>Reframed: ${esc(a.reframed)}</small>`:""}${a.question?`<br><input data-q="${esc(a.question)}" placeholder="${esc(a.question)}">`:""}</div>`).join(""):"<p>No issues found.</p>")+`<div class="bar"><button class="b" onclick="redo()">Re-synthesize with my answers</button><button class="b alt" onclick="show('preview')">Proceed with current evidence</button></div>`}
function redo(){S.clar=[...document.querySelectorAll("[data-q]")].filter(e=>e.value.trim()).map(e=>({question:e.dataset.q,answer:e.value.trim()}));analyze()}
const heads=(m,forDoc)=>[
["Teacher’s Observation Sheet",1],
["Name of the teacher: "+m.t],
["Date of the observation: "+m.d],
forDoc?["Grade: "+m.g+sp(15)+"Subject:- "+m.s+sp(15)+"Topic:- "+m.tp]:[`<div style="display:flex;justify-content:space-between"><span>Grade: ${esc(m.g)}</span><span>Subject:- ${esc(m.s)}</span><span>Topic:- <bdi dir="auto" style="font-family:'Kanz-al-Lulu','Kanz-Arabic-Auto','Amiri',sans-serif;font-size:1.18em">${esc(m.tp)}</bdi></span></div>`,0,true],
forDoc?["Name of the observer: "+m.o+sp(40)+"Obs No: "+m.n]:[`<div style="display:flex;justify-content:space-between"><span>Name of the observer: ${esc(m.o)}</span><span>Obs No: ${esc(m.n)}</span></div>`,0,true]
];
function model(m,forDoc){const r=heads(m,forDoc).map(([f,b,raw])=>({f,b,raw}));SEC.forEach((s,si)=>{r.push({f:s.h,b:1});if(!si)r.push({a:"Observation Criteria",b:NOTE,bold:1});s.i.forEach(c=>{const k=FLAT.indexOf(c);r.push({a:c,k,b:S.c["c"+(k+1)]||""})})});return r}
const model2=()=>[{a:T2[0],b:S.hl,k:"hl"},{a:T2[1],b:S.imp,k:"imp"}];
const bd=(x,b,raw)=>raw?x:(b?"<b>"+esc(x)+"</b>":esc(x));
const tbl=r=>`<table>`+r.map(x=>x.f!=null?`<tr><td colspan="2">${bd(x.f,x.b,x.raw)}</td></tr>`:`<tr><td>${bd(x.a,x.bold)}</td><td${x.k!=null?` class="e" contenteditable data-k="${x.k}"`:""}>${bd(x.b,x.bold)}</td></tr>`).join("")+"</table>";
const drawSheet=()=>{$("#sheet").innerHTML=tbl(model(M())).replace("<table>",'<table><colgroup><col style="width:42%"><col style="width:58%"></colgroup>')+"<h3>Teacher Observation Summary</h3>"+tbl(model2()).replace("<table>",'<table><colgroup><col style="width:42%"><col style="width:58%"></colgroup>')};
const sync=()=>document.querySelectorAll("#sheet [data-k]").forEach(td=>{const k=td.dataset.k,v=td.innerText.trim();if(k=="hl")S.hl=v;else if(k=="imp")S.imp=v;else S.c["c"+(+k+1)]=v});
const fname=e=>`Observation_Summary_${M().t.replace(/\s+/g,"_")}_Obs${M().n}_${M().d}.${e}`;
function word(){sync();const D=docx,B={style:D.BorderStyle.SINGLE,size:8,color:"000000"},bo={top:B,bottom:B,left:B,right:B},W=[4396,6070];

// ─── PWA FIELD RELIABILITY & INDEXEDDB STORAGE ─────────────────────────────
const IDB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('ImaniObservationDB', 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('drafts')) db.createObjectStore('drafts', { keyPath: 'key' });
        if (!db.objectStoreNames.contains('sync_queue')) db.createObjectStore('sync_queue', { keyPath: 'id' });
      };
      req.onsuccess = () => resolve(this.db = req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async get(store, key) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).get(key);
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  },
  async set(store, val) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).put(val);
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  },
  async del(store, key) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).delete(key);
      req.onsuccess = () => res(true);
      req.onerror = () => rej(req.error);
    });
  },
  async all(store) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => res(req.result || []);
      req.onerror = () => rej(req.error);
    });
  }
};

let autoSaveTimer = null;
function setDraftStatus(msg) {
  const el = document.getElementById('draftStatus');
  if (el) el.textContent = msg;
}

function triggerAutoSave() {
  setDraftStatus("Saving draft...");
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(performAutoSave, 1200);
}

async function performAutoSave() {
  const m = M();
  const rawNotes = $("#notes") ? $("#notes").value : "";
  if (!m.t && !rawNotes.trim()) {
    setDraftStatus("");
    return;
  }
  const guided = [...document.querySelectorAll("[data-i]")].map(e => ({
    i: e.dataset.i,
    t: e.dataset.t || "",
    val: e.value
  }));
  const draft = {
    key: 'active_draft',
    meta: m,
    notes: rawNotes,
    guided: guided,
    state: { c: S.c, hl: S.hl, imp: S.imp, audit: S.audit, id: S.id, formRow: S.formRow },
    updatedAt: new Date().toISOString()
  };
  try {
    await IDB.set('drafts', draft);
    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    setDraftStatus(`Draft auto-saved (${timeStr})`);
  } catch(e) {
    console.warn("Auto-save warning:", e);
  }
}

async function checkDraftOnLoad() {
  try {
    const draft = await IDB.get('drafts', 'active_draft');
    if (!draft || (!draft.notes?.trim() && !draft.meta?.t)) return;
    const banner = document.getElementById('draftBanner');
    if (!banner) return;
    const time = new Date(draft.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const teacherName = draft.meta?.t || 'Unnamed Teacher';
    banner.innerHTML = `
      <div class="banner" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:#e3efec;border-left:4px solid var(--g);margin:10px 0;padding:10px 14px;border-radius:4px;">
        <div>
          <b>📝 Unsaved draft found for "${esc(teacherName)}"</b> (auto-saved at ${time})
        </div>
        <div style="display:flex;gap:6px;">
          <button class="b" onclick="restoreDraft()" style="padding:4px 12px;font-size:13px;min-height:32px;">Restore Draft</button>
          <button class="b alt" onclick="discardDraft()" style="padding:4px 12px;font-size:13px;min-height:32px;">Discard</button>
        </div>
      </div>
    `;
    banner.style.display = 'block';
  } catch(e) {
    console.error("Draft check failed:", e);
  }
}

async function restoreDraft() {
  try {
    const draft = await IDB.get('drafts', 'active_draft');
    if (!draft) return;
    setM(draft.meta);
    if ($("#notes")) $("#notes").value = draft.notes || "";
    if (draft.guided) {
      draft.guided.forEach(g => {
        const input = document.querySelector(`input[data-i="${g.i}"]`);
        if (input) {
          input.value = g.val || "";
          input.dataset.t = g.t || "";
          const p = input.parentNode;
          if (p) {
            p.querySelectorAll(".chip").forEach(x => {
              const isAppr = x.textContent.includes("Appreciation") && g.t.includes("APPRECIATION");
              const isAppreh = x.textContent.includes("Apprehension") && g.t.includes("APPREHENSION");
              x.style.background = (isAppr || isAppreh) ? "#cfe8e2" : "#fff";
            });
          }
        }
      });
    }
    if (draft.state) {
      S.c = draft.state.c || {};
      S.hl = draft.state.hl || "";
      S.imp = draft.state.imp || "";
      S.audit = draft.state.audit || [];
      S.id = draft.state.id;
      S.formRow = draft.state.formRow;
    }
    document.getElementById('draftBanner').style.display = 'none';
    showToast("✅ Draft restored successfully!");
    chk();
  } catch(e) {
    console.error("Restore error:", e);
  }
}

async function discardDraft() {
  if (confirm("Are you sure you want to discard this unsaved draft?")) {
    await IDB.del('drafts', 'active_draft');
    document.getElementById('draftBanner').style.display = 'none';
    setDraftStatus("");
  }
}

async function updateQueueBadge() {
  try {
    const queue = await IDB.all('sync_queue');
    const qb = document.getElementById('queueBanner');
    if (!qb) return;
    if (queue.length > 0) {
      qb.innerHTML = `
        <div class="banner" style="background:#fff3cd;border-left:4px solid #856404;color:#856404;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:4px;margin:10px 0;">
          <div><b>📡 Offline Queue:</b> ${queue.length} observation(s) saved locally pending sync to Google Sheets.</div>
          <button class="b" onclick="processSyncQueue()" style="padding:4px 12px;font-size:13px;min-height:32px;">Sync Now</button>
        </div>
      `;
      qb.style.display = 'block';
    } else {
      qb.style.display = 'none';
    }
  } catch(e) {
    console.error("Queue badge error:", e);
  }
}

async function processSyncQueue() {
  if (!navigator.onLine) {
    alert("Still offline. Reconnect to the internet to sync pending observations.");
    return;
  }
  try {
    const queue = await IDB.all('sync_queue');
    if (!queue.length) return;
    let synced = 0;
    for (const item of queue) {
      try {
        await post("save", { record: item.record });
        await IDB.del('sync_queue', item.id);
        synced++;
      } catch(e) {
        console.warn("Sync failed for item:", item.id, e);
      }
    }
    if (synced > 0) {
      await updateQueueBadge();
      await reload();
      showToast(`✅ Synced ${synced} observation(s) to Google Sheets!`);
    }
  } catch(e) {
    console.error("Queue process error:", e);
  }
}

function updateNetworkUI() {
  const badge = document.getElementById('netBadge');
  if (!badge) return;
  if (navigator.onLine) {
    badge.innerHTML = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#48bb78;"></span>Online`;
    badge.title = "Connected to internet";
    processSyncQueue();
  } else {
    badge.innerHTML = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#f56565;"></span>Offline (Saving locally)`;
    badge.title = "Offline - notes saved to device";
  }
  updateQueueBadge();
}

window.addEventListener('online', updateNetworkUI);
window.addEventListener('offline', updateNetworkUI);

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'inline-block';
});

async function installPWA() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'none';
}

window.addEventListener('appinstalled', () => {
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'none';
  showToast("🎉 Portal installed as standalone app!");
});

function showToast(msg) {
  let toast = document.getElementById('appToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'appToast';
    toast.style.cssText = 'position:fixed;bottom:20px;right:20px;background:var(--g);color:#fff;padding:12px 20px;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.25);z-index:9999;font-weight:600;font-size:14px;transition:opacity 0.3s ease;opacity:0;pointer-events:none;';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 3500);
}

async function save(){
  sync();
  const m = M();
  const recData = {
    id: S.id || (window.crypto && crypto.randomUUID ? crypto.randomUUID() : 'obs_' + Date.now()),
    teacher: m.t,
    date: m.d,
    grade: m.g,
    subject: m.s,
    topic: m.tp,
    observer: m.o,
    obs: m.n,
    notes: S.notes || $("#notes").value,
    c: S.c,
    hl: S.hl,
    imp: S.imp,
    log: S.audit,
    formRow: S.formRow
  };

  if (!navigator.onLine) {
    await IDB.set('sync_queue', { id: recData.id, record: recData, queuedAt: new Date().toISOString() });
    await IDB.del('drafts', 'active_draft');
    updateQueueBadge();
    setDraftStatus("Saved to offline queue");
    alert("📡 Offline Mode: Observation saved safely to your device's local queue! It will automatically sync to Google Sheets once Wi-Fi reconnects.");
    return;
  }

  try {
    const r = await post("save", { record: recData });
    S.id = r.id;
    await IDB.del('drafts', 'active_draft');
    setDraftStatus("All changes saved");
    await reload();
    showToast("✅ Successfully saved to Google Sheets!");
  } catch(e) {
    await IDB.set('sync_queue', { id: recData.id, record: recData, queuedAt: new Date().toISOString() });
    updateQueueBadge();
    alert("Network request failed. Observation saved safely to your offline queue! It will sync automatically when connection restores.");
  }
}
async function reload(){try{HIST=(await get("history")).records;$("#tl").innerHTML=[...new Set(HIST.map(r=>r.teacher))].map(t=>`<option value="${esc(t)}">`).join("");arch()}catch(e){if(!API.startsWith("PASTE"))fail(e)}}
function arch(){const f=["at","ag","as","ao"].map(i=>$("#"+i).value.toLowerCase()),L=HIST.filter(r=>[r.teacher,r.grade,r.subject,r.observer].every((v,i)=>String(v).toLowerCase().includes(f[i])));
$("#alist").innerHTML=L.map(r=>`<div class="card"><b>${esc(r.teacher)}</b>, Obs ${esc(r.obs)}, ${esc(r.date)}<br><small>Grade ${esc(r.grade)}, ${esc(r.subject)}, ${esc(r.topic)}, observer ${esc(r.observer)}</small><br><button class="b alt" onclick="openRec('${r.id}')">Open</button></div>`).join("")||"<p>No saved observations match.</p>"}
function openRec(id){const r=HIST.find(x=>x.id==id);setM({t:r.teacher,d:r.date,g:r.grade,s:r.subject,tp:r.topic,o:r.observer,n:r.obs});S={c:r.c||{},hl:r.hl,imp:r.imp,audit:[],clar:[],id:r.id,notes:r.notes};show("preview")}
async function pend(){try{PEND=(await get("pending")).pending}catch(e){return fail(e)}
$("#plist").innerHTML=PEND.map((p,i)=>`<div class="card"><b>${esc(p.teacher)}</b>, ${esc(p.date)}, ${esc(p.observer)}<br><small>${esc(String(p.notes).slice(0,140))}</small><br><button class="b alt" onclick="useP(${i})">Synthesize and open</button></div>`).join("")||"<p>No pending submissions.</p>"}
function useP(i){const p=PEND[i];setM({t:p.teacher,d:p.date,g:p.grade,s:p.subject,tp:p.topic,o:p.observer,n:p.obs});$("#notes").value=p.notes;S.formRow=p.row;show("intake");analyze()}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
show("intake");reload();
updateNetworkUI();
checkDraftOnLoad();
updateQueueBadge();

document.addEventListener('input', e => {
  if (e.target.closest('#intake') || e.target.closest('#sheet')) {
    triggerAutoSave();
  }
});
document.addEventListener('change', e => {
  if (e.target.closest('#intake')) {
    triggerAutoSave();
  }
});
